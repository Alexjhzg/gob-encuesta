[project]
name = "kobo-geo-dashboard-backend"
version = "1.0.0"
description = "FastAPI Proxy Server & GeoJSON Transformation Engine for KoboToolbox KPI API v2"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests_python"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

