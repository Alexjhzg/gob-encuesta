name: CI — Quality & Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-and-express:
    name: Frontend & Express (Lint, Build, Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Build production bundle
        run: npm run build

      - name: Run Vitest suite
        run: npm test

  backend-python:
    name: Backend FastAPI (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run Ruff lint
        run: ruff check backend tests_python download_kobo_data.py

      - name: Check Ruff formatting
        run: ruff format --check backend tests_python download_kobo_data.py

      - name: Run Pytest suite
        run: PYTHONPATH=. pytest tests_python

